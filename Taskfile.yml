version: '3'

# The package uses its own shared tasks, as a project does through node_modules.
includes:
  baseline:
    taskfile: ./Taskfile.baseline.yml

tasks:
  setup:
    desc: Install dependencies from the lockfile
    cmds:
      - pnpm install --frozen-lockfile

  build:
    desc: Build dist/
    cmds:
      - pnpm build

  check:
    desc: Build, then the shared check, whose verify runs the built CLI on the package itself, then check the rulebook listing and lint the COUPLED tags
    cmds:
      - task: build
      - task: baseline:check
      - task: rulebook
      - coupled

  rulebook-coverage:
    desc: Write rulebook-coverage.json, how ts-ianf-strict-baseline enforces the code rulebook
    cmds:
      - node src/main.ts rulebook > rulebook-coverage.json

  rulebook:
    desc: Check rulebook-coverage.json against the release of the code rulebook it is assessed for
    vars:
      # Moving to a new release means assessing what it changed.
      RULEBOOK_RELEASE: v0.3.0
    env:
      # code-rulebook is private; Git needs access to it, as the README says.
      GOPRIVATE: github.com/ianflanagan1/code-rulebook
      GOTOOLCHAIN: local
    cmds:
      - go run github.com/ianflanagan1/code-rulebook/cmd/code-rulebook@{{.RULEBOOK_RELEASE}} check-listing

  format:
    desc: Format every file
    cmds:
      - task: baseline:format

  lint-file:
    desc: Format, fix and lint the files given after --
    cmds:
      - task: baseline:lint-file

  publish:
    desc: Publish VERSION to npm with provenance, run by .github/workflows/publish.yml
    requires:
      vars: [VERSION]
    cmds:
      - |
        name=$(node --print 'require("./package.json").name')
        if ! npm view "$name" name >/dev/null 2>&1; then
          echo "::notice::$name isn't on npm yet: run \`npmjs publish\`, which publishes {{.VERSION}} and trusts this workflow."
          exit 0
        fi
        if npm view "$name@{{.VERSION}}" version >/dev/null 2>&1; then
          echo "::notice::npm already has $name@{{.VERSION}}."
          exit 0
        fi
        npm version "{{.VERSION}}" --no-git-tag-version --allow-same-version
        npm publish --provenance --access public
